name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # Default, but stated explicitly: a release is all-platforms-or-nothing.
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install musl build tools (Linux legs only)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS legs only)
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        run: |
          BIN="target/${{ matrix.target }}/release/1router"
          case "${{ matrix.target }}" in
            *-apple-darwin) strip -x "$BIN" ;;
            *)              strip "$BIN" ;;
          esac

      - name: Package tarball (Linux/macOS legs only)
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        run: |
          tar -czf "1router-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" 1router

      - name: Package zip (Windows leg only)
        if: ${{ startsWith(matrix.runner, 'windows') }}
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/1router.exe" `
            -DestinationPath "1router-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1router-${{ github.ref_name }}-${{ matrix.target }}
          path: 1router-${{ github.ref_name }}-${{ matrix.target }}.*
          retention-days: 7

  release:
    name: release
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  # Depends on `release` (not parallel with it) so ghcr.io/.../1router:latest
  # only ever moves once the full binary release for this tag has succeeded.
  docker:
    name: docker
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/ducphamhoang/1router:${{ github.ref_name }}
            ghcr.io/ducphamhoang/1router:latest
