name: Security Audit

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --locked
