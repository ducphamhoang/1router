[package]
name = "router"
version = "0.3.4"
edition = "2021"
default-run = "1router"

[lib]
name = "router"
path = "src/lib.rs"

[[bin]]
name = "1router"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
arc-swap = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
urlencoding = "2"
dialoguer = "0.12.0"
argon2 = "0.5"
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[features]
default = ["ui"]
ui = ["dep:rust-embed"]

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
